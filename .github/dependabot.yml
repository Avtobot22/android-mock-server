version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Novosibirsk"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      kotlin:
        patterns:
          - "jvm"
          - "plugin.serialization"
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
      ktor:
        patterns:
          - "io.ktor:*"
      okhttp:
        patterns:
          - "com.squareup.okhttp3:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Novosibirsk"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
